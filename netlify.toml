[build]
  command = "npm run generate"
  publish = ".output/public"

# 米游社扫码登录所需的私有参数（来自 user.mihoyo.com 抓包）。
# 注意：随米游社版本可能失效，需定期更新。
[context.deploy.environment]
  MIHOYO_APP_ID = "dw9y09jqjpxc"
  MIHOYO_DEVICE_ID = "1760c6b8-228b-4f92-8918-eb498724d380"
  MIHOYO_DEVICE_FP = "38d81ab24d683"
  MIHOYO_SDK_VERSION = "2.54.0"
  MIHOYO_CLIENT_TYPE = "4"
  MIHOYO_GAME_BIZ = "plat_cn"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 定时任务：每小时清理过期 Fairy 待确认操作与超期审计日志
[functions.scheduled]
  schedule = "0 * * * *"

# 智谱 GLM（Fairy AI 对话）密钥：生产环境必须在 Netlify 后台配置
# Site settings → Environment variables → 新建 GLM_API_KEY（scope 含 Functions）。
# ⚠️ 仓库内置的旧 key 已公开在 GitHub 历史中，被智谱风控（数据中心 IP 返回 401）；
#    请到 https://open.bigmodel.cn 重新生成新 key 后配置，配置前可先本地验证：
#    `node scripts/verify-glm-key.mjs "<新key>"`
# 推荐生产环境配置：
#   GLM_API_KEY —— 智谱 API 密钥（必配，覆盖内置值）
#   JWT_SECRET —— 生产必配，缺失时使用开发密钥并告警

# API 路由由函数源码内的 config.path（/api/*）声明，无需在此配置。

# SPA 前端路由回退到 index.html（函数 /api/* 优先于重定向，见请求处理顺序）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
