[build]
  command = "npm run generate"
  publish = ".output/public"

# 米游社扫码登录所需的私有参数（来自 user.mihoyo.com 抓包）。
# 注意：随米游社版本可能失效，需定期更新。
[context.deploy.environment]
  MIHOYO_APP_ID = "dw9y09jqjpxc"
  MIHOYO_DEVICE_ID = "1760c6b8-228b-4f92-8918-eb498724d380"
  MIHOYO_DEVICE_FP = "38d81ab24d683"
  MIHOYO_SDK_VERSION = "2.54.0"
  MIHOYO_CLIENT_TYPE = "4"
  MIHOYO_GAME_BIZ = "plat_cn"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API 路由由函数源码内的 config.path（/api/*）声明，无需在此配置。

# SPA 前端路由回退到 index.html（函数 /api/* 优先于重定向，见请求处理顺序）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
